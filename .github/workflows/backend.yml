name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/release-team-intelligenz-1:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/release-team-intelligenz-1:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/release-team-intelligenz-1:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/release-team-intelligenz-1:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/release-team-intelligenz-1:${{ github.sha }}"

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Stopping old container..."
            docker stop intelligenz-backend || true

            echo "Removing old container..."
            docker rm intelligenz-backend || true

            echo "Starting new container..."
            docker run -d \
              --name intelligenz-backend \
              -p 8000:8000 \
              --env-file /home/ubuntu/.env \
              -v intelligenz-data:/app/data \
              -v intelligenz-db:/app/database \
              -v intelligenz-uploads:/app/uploads \
              -v /home/ubuntu/source_of_truth:/app/source_of_truth:ro \
              --restart unless-stopped \
              "$IMAGE"

            echo "Waiting for container to become healthy..."

            for i in {1..12}; do
              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                intelligenz-backend 2>/dev/null || echo "starting")

              echo "Health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "Deployment successful!"
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Container became unhealthy."
                docker logs --tail 100 intelligenz-backend
                exit 1
              fi

              sleep 10
            done

            echo "Health check timed out."
            docker logs --tail 100 intelligenz-backend
            exit 1